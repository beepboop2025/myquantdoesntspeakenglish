name: sync evidence wire

on:
  schedule:
    # Check four times daily; the job commits only when the evidence fingerprint changes.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidence-wire-refresh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sync
      - run: npm run verify
      - name: Publish a changed wire cache
        run: |
          if git diff --quiet -- data/cache.json; then
            echo "Wire unchanged"
            exit 0
          fi
          git config user.name "myquant-wire"
          git config user.email "wire@myquantdoesntspeakenglish.com"
          git add data/cache.json
          git commit -m "content: refresh editorial network $(date -u +%FT%H:%MZ)"
          git push
