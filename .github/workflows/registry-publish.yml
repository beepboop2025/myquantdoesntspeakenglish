name: Publish MCP Registry record

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact deployed main SHA to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: myquant-editorial-mcp-registry
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
  EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Bind publication to current main
        run: |
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_RELEASE_SHA"
          test -z "$(git status --porcelain)"
      - run: npm ci
      - run: npm test
      - run: MYQUANT_USE_REVIEWED_CACHE=1 npm run build
      - run: npm run verify
      - name: Require the reviewed checkout to remain unchanged
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - run: npm run smoke:live
      - name: Validate Registry manifest identity
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const server = JSON.parse(await readFile('server.json', 'utf8'))
          if (server.name !== 'io.github.beepboop2025/myquant-editorial'
            || server.version !== '2.1.0'
            || server.remotes?.[0]?.url !== 'https://myquantdoesntspeakenglish.com/mcp') {
            throw new Error('unexpected Registry identity')
          }
          NODE
      - name: Install mcp-publisher (pinned and hash-verified)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" mcp-publisher
          chmod 0755 "$RUNNER_TEMP/mcp-publisher"
          "$RUNNER_TEMP/mcp-publisher" validate server.json
      - name: Recheck exact main immediately before publication
        run: |
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_RELEASE_SHA"
      - name: Authenticate by GitHub OIDC
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
      - name: Publish the reviewed server card
        id: publish
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/mcp-publisher" publish server.json
      - name: Prove the official Registry record is active and latest
        run: |
          if [[ "${{ steps.publish.outcome }}" != "success" ]]; then
            echo "Publisher returned nonzero; checking canonical state for an idempotent or ambiguous publish."
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import { setTimeout as delay } from 'node:timers/promises'

          const manifest = JSON.parse(await readFile('server.json', 'utf8'))
          const name = encodeURIComponent(manifest.name)
          const url = `https://registry.modelcontextprotocol.io/v0.1/servers/${name}/versions/latest`
          let lastError
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(20_000) })
              if (!response.ok) throw new Error(`Registry returned HTTP ${response.status}`)
              const payload = await response.json()
              assert.deepEqual(payload.server, manifest)
              const official = payload._meta?.['io.modelcontextprotocol.registry/official']
              if (official?.status !== 'active' || official?.isLatest !== true) {
                throw new Error('Registry record is not active/latest')
              }
              console.log(JSON.stringify({ name: manifest.name, version: manifest.version, status: official.status, isLatest: official.isLatest }))
              process.exit(0)
            } catch (error) {
              lastError = error
              if (attempt < 12) await delay(10_000)
            }
          }
          throw lastError
          NODE
